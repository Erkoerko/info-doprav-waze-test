name: Waze – dva body, osem smerov (manualny test)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  endpoint_pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Nacitat repozitar
        uses: actions/checkout@v4
      - name: Nastavit Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalovat pywaze
        run: pip install pywaze==1.2.5
      - name: Overit pravidla bez internetu
        run: python -m unittest discover -s scripts -p 'test_endpoint_unit.py' -v
      - name: Zmerat osem smerov podla dvoch bodov
        run: python scripts/waze_endpoint_pilot.py
